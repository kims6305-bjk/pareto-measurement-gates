[project]
name = "reflection-gate"
version = "0.1.0"
description = "Fail-closed 4단계 인용 검증 게이트 (Phase 0 골격) — K-IFRS 인용 QA 리플렉션 프로브용"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reflection_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
